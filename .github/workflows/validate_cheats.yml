name: Validate Cheat PR

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-cheats:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Validate all cheats
        run: |
          python .github/scripts/validate_cheats.py
